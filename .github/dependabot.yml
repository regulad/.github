# Dependabot keeps the pre-commit hooks' revisions (.pre-commit-config.yaml)
# current, weekly, as in Koala and Warlock. This repository has no workflows
# and no other dependencies.
#
# An update waits until its release is two weeks old (`cooldown`). Security
# updates don't wait: the cooldown doesn't apply to them.
#
# Its label is in .github/settings.yml, which deletes labels it doesn't list.
version: 2
updates:
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      pre-commit:
        patterns: ["*"]
